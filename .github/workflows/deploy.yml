name: Build and deploy Spring Boot submodule to Azure App Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build submodule
        run: ./gradlew :vnim2413-spring:build -x test

      - name: Build bootJar
        run: ./gradlew :vnim2413-spring:bootJar -x test

      - name: List built jars
        run: ls -la vnim2413-spring/build/libs

      - name: Show repo structure
        run: |
          pwd
          ls -la
          find . -maxdepth 4 -type f | sort

      - name: Show submodule build output
        run: |
          ls -la vnim2413-spring
          ls -la vnim2413-spring/build || true
          ls -la vnim2413-spring/build/libs || true

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mp-java-veres-norbert'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: 'vnim2413-spring/build/libs/*.jar'